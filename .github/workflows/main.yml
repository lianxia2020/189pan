name: 天翼云盘签到

on:
  schedule:
    # 北京时间 09:30 和 21:30 = UTC 01:30 和 13:30
    - cron: '30 1,13 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          QYWX_KEY: ${{ secrets.QYWX_KEY }}
          DEBUG: ${{ vars.DEBUG || 'true' }}
        run: python3 main.py
